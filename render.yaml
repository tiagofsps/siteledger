# Render Blueprint for the Partilha Louca Operations Management application.
#
# Evaluation configuration: both resources use free instances so the service can
# be tried without a payment method. Free web services spin down after 15 minutes
# of inactivity and free PostgreSQL databases are deleted after 30 days. See
# docs/render-deployment.md for the limitations and the paid upgrade path.

databases:
  - name: partilha-louca-db
    databaseName: partilha_louca
    user: partilha_louca
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: partilha-louca
    runtime: python
    plan: free
    region: frankfurt
    # Render deploys a commit only after its GitHub checks pass, so a failing CI
    # run never reaches production.
    autoDeployTrigger: "checksPass"
    healthCheckPath: /login/
    # Free instances have no pre-deploy command and run a single instance, so
    # migrations run in the build command.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.10"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: partilha-louca-db
          property: connectionString
