# Render Blueprint for the Partilha Louca Operations Management application.
#
# Hobby workspace with small paid compute plans. Free compute is suitable only
# for temporary testing: free web services spin down and free Postgres expires.

databases:
  - name: partilha-louca-db
    databaseName: partilha_louca
    user: partilha_louca
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: partilha-louca
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    # Deploys are triggered by the GitHub Actions deploy job through a deploy
    # hook, after the test job passes.
    autoDeployTrigger: "off"
    healthCheckPath: /login/
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.10"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: partilha-louca-db
          property: connectionString
