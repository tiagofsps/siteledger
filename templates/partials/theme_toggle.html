<button
  id="theme-toggle"
  class="theme-switch"
  type="button"
  role="switch"
  aria-checked="false"
  aria-label="Modo escuro"
  title="Alternar tema"
>
  <span class="theme-switch-track" aria-hidden="true">
    <span class="theme-switch-option theme-switch-option--sun">☀</span>
    <span class="theme-switch-option theme-switch-option--moon">☾</span>
    <span class="theme-switch-thumb"></span>
  </span>
</button>
