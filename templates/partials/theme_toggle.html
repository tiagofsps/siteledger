<button
  id="theme-toggle"
  class="theme-switch"
  type="button"
  role="switch"
  aria-checked="false"
  aria-label="Modo escuro"
  title="Alternar tema"
>
  <span class="theme-switch-track" aria-hidden="true">
    <span class="theme-switch-option theme-switch-option--sun">
      <svg class="theme-switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
    </span>
    <span class="theme-switch-option theme-switch-option--moon">
      <svg class="theme-switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </span>
    <span class="theme-switch-thumb"></span>
  </span>
</button>
